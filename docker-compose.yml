services:
  db:
    image: pgvector/pgvector:pg16
    container_name: banking_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: banking_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  client-frontend:
    build: ./clients/frontend
    container_name: banking_client_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./clients/frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  employee-frontend:
    build: ./employees/frontend
    container_name: banking_employee_frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    volumes:
      - ./employees/frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata: