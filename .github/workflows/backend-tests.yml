name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: banking_admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: banking_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run tests
        working-directory: backend
        env:
          POSTGRES_USER: banking_admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: banking_system_test
          DATABASE_URL: postgresql://banking_admin:testpassword@localhost:5432/banking_system_test
          SECRET_KEY: ci-test-secret-key
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          PYDANTIC_AI_GATEWAY_API_KEY: ${{ secrets.PYDANTIC_AI_GATEWAY_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: uv run pytest tests/ -v